name: walletx-prod

services:
  # =========================================================================
  # 1. API GATEWAY (Public Facing Reverse Proxy & Auth Check)
  # =========================================================================
  api-gateway:
    image: ${DOCKER_REGISTRY:-10xdevian134}/wallet-api-gateway:${IMAGE_TAG:-prod}
    build:
      context: .
      dockerfile: docker/api-gateway/Dockerfile
    container_name: api-gateway
    restart: always
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080" # Host:Container (API Gateway HTTP & /ws)
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://auth-service:6001
      - WALLET_SERVICE_URL=http://wallet-service:6002
      - BANK_SERVICE_URL=http://bank-service:6005
      - REALTIME_SERVICE_URL=http://realtime-service:6006
    depends_on:
      - auth-service
      - wallet-service
      - bank-service
      - worker-service
      - realtime-service
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - walletx-prod-net

  # =========================================================================
  # 2. AUTH SERVICE (Authentication, MFA & Device Fingerprinting)
  # =========================================================================
  auth-service:
    image: ${DOCKER_REGISTRY:-10xdevian134}/wallet-auth-service:${IMAGE_TAG:-prod}
    build:
      context: .
      dockerfile: docker/auth-service/Dockerfile
    container_name: auth-service
    restart: always
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:6001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - walletx-prod-net

  # =========================================================================
  # 3. WALLET SERVICE (Transfers, Balances, Holds & Idempotency)
  # =========================================================================
  wallet-service:
    image: ${DOCKER_REGISTRY:-10xdevian134}/wallet-wallet-service:${IMAGE_TAG:-prod}
    build:
      context: .
      dockerfile: docker/wallet-service/Dockerfile
    container_name: wallet-service
    restart: always
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:6002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - walletx-prod-net

  # =========================================================================
  # 4. BANK SERVICE (Simulated Bank Webhooks, Accounts & Debits)
  # =========================================================================
  bank-service:
    image: ${DOCKER_REGISTRY:-10xdevian134}/wallet-bank-service:${IMAGE_TAG:-prod}
    build:
      context: .
      dockerfile: docker/bank-service/Dockerfile
    container_name: bank-service
    restart: always
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:6005/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - walletx-prod-net

  # =========================================================================
  # 5. WORKER SERVICE (Background Consumers, Outbox Dispatcher & Cron Jobs)
  # =========================================================================
  worker-service:
    image: ${DOCKER_REGISTRY:-10xdevian134}/wallet-worker-service:${IMAGE_TAG:-prod}
    build:
      context: .
      dockerfile: docker/worker-service/Dockerfile
    container_name: worker-service
    restart: always
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - walletx-prod-net

  # =========================================================================
  # 6. REALTIME SERVICE (WebSocket Push for Balances & Transactions)
  # =========================================================================
  realtime-service:
    image: ${DOCKER_REGISTRY:-10xdevian134}/wallet-realtime-service:${IMAGE_TAG:-prod}
    build:
      context: .
      dockerfile: docker/realtime-service/Dockerfile
    container_name: realtime-service
    restart: always
    ports:
      - "${REALTIME_SERVICE_PORT:-6006}:6006" # WebSocket exposed
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - walletx-prod-net

networks:
  walletx-prod-net:
    name: walletx-prod-net
    driver: bridge
