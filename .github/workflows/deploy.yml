name: Smart Build and Deploy Wallet App

on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # 1. API GATEWAY
  # ==========================================
  api-gateway:
    if: contains(github.event.head_commit.message, '[all]') || contains(github.event.head_commit.message, '[api-gateway]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: |
          docker build -f docker/api-gateway/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/wallet-api-gateway:prod .
          docker push ${{ secrets.DOCKER_USERNAME }}/wallet-api-gateway:prod

  # ==========================================
  # 2. AUTH SERVICE
  # ==========================================
  auth-service:
    if: contains(github.event.head_commit.message, '[all]') || contains(github.event.head_commit.message, '[auth-service]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: |
          docker build -f docker/auth-service/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/wallet-auth-service:prod .
          docker push ${{ secrets.DOCKER_USERNAME }}/wallet-auth-service:prod

  # ==========================================
  # 3. WALLET SERVICE
  # ==========================================
  wallet-service:
    if: contains(github.event.head_commit.message, '[all]') || contains(github.event.head_commit.message, '[wallet-service]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: |
          docker build -f docker/wallet-service/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/wallet-service:prod .
          docker push ${{ secrets.DOCKER_USERNAME }}/wallet-service:prod

  # ==========================================
  # 4. BANK SERVICE
  # ==========================================
  bank-service:
    if: contains(github.event.head_commit.message, '[all]') || contains(github.event.head_commit.message, '[bank-service]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: |
          docker build -f docker/bank-service/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/wallet-bank-service:prod .
          docker push ${{ secrets.DOCKER_USERNAME }}/wallet-bank-service:prod

  # ==========================================
  # 5. WORKER SERVICE
  # ==========================================
  worker-service:
    if: contains(github.event.head_commit.message, '[all]') || contains(github.event.head_commit.message, '[worker-service]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: |
          docker build -f docker/worker-service/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/wallet-worker-service:prod .
          docker push ${{ secrets.DOCKER_USERNAME }}/wallet-worker-service:prod

  # ==========================================
  # 6. REALTIME SERVICE
  # ==========================================
  realtime-service:
    if: contains(github.event.head_commit.message, '[all]') || contains(github.event.head_commit.message, '[realtime-service]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - run: |
          docker build -f docker/realtime-service/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/wallet-realtime-service:prod .
          docker push ${{ secrets.DOCKER_USERNAME }}/wallet-realtime-service:prod

  # ==========================================
  # 7. DEPLOY TO DIGITALOCEAN
  # ==========================================
  deploy-to-droplet:
    name: Deploy to DigitalOcean
    needs:
      [
        api-gateway,
        auth-service,
        wallet-service,
        bank-service,
        worker-service,
        realtime-service,
      ]
    # This logic ensures deployment ONLY runs if at least one build ran and succeeded.
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      contains(needs.*.result, 'success')
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd wallet-app
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker image prune -f
